
name: Deploy Angular to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-cloudcomputing-lab
  ACR_NAME: cloudlab319985
  ACR_LOGIN_SERVER: cloudlab319985.azurecr.io
  IMAGE_NAME: final-angular-ui
  CONTAINER_APP_NAME: final-angular-ui
  CONTAINER_APP_ENV: env-cloudcomputing

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: |
          az extension add \
            --name containerapp \
            --upgrade \
            --yes

      - name: Verify Azure resources
        run: |
          echo "=== Azure account ==="
          az account show \
            --query "{Subscription:id,Tenant:tenantId}" \
            --output json

          echo "=== Resource group ==="
          az group show \
            --name "$RESOURCE_GROUP" \
            --query "{Name:name,Location:location}" \
            --output json

          echo "=== Container Apps environments ==="
          az containerapp env list \
            --resource-group "$RESOURCE_GROUP" \
            --output table

          echo "=== Target environment ==="
          az containerapp env show \
            --name "$CONTAINER_APP_ENV" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{Name:name,Id:id,Location:location}" \
            --output json

      - name: Set image tag
        id: image
        run: |
          echo "tag=${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        run: |
          az acr login --name "$ACR_NAME"

          docker build \
            -t "${{ steps.image.outputs.tag }}" \
            .

          docker push "${{ steps.image.outputs.tag }}"

      - name: Create or update Container App
        run: |
          IMAGE="${{ steps.image.outputs.tag }}"

          if az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --output none 2>/dev/null; then

            echo "Updating existing Container App..."

            az containerapp update \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE"

          else

            echo "Creating new Container App..."

            az containerapp create \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$CONTAINER_APP_ENV" \
              --image "$IMAGE" \
              --registry-server "$ACR_LOGIN_SERVER" \
              --registry-identity system \
              --system-assigned \
              --ingress external \
              --target-port 80 \
              --cpu 0.25 \
              --memory 0.5Gi \
              --min-replicas 0 \
              --max-replicas 1

          fi

      - name: Verify deployment
        run: |
          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{State:properties.provisioningState,Running:properties.runningStatus,Image:properties.template.containers[0].image,FQDN:properties.configuration.ingress.fqdn}" \
            --output table