

name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy_job:
    name: Build and Deploy Angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Angular production
        run: pnpm exec ng build --configuration production

      - name: Verify Angular build output
        shell: bash
        run: |
          APP_DIR="dist/client-management-ui/browser"

          if [ ! -f "$APP_DIR/index.html" ]; then
            echo "::error::Angular index.html not found"
            exit 1
          fi

          echo "Angular build output verified."
          ls -lah "$APP_DIR"

      - name: Verify Azure deployment token
        shell: bash
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "::error::Azure deployment token is missing"
            exit 1
          fi

          if [ "${#SWA_TOKEN}" -lt 50 ]; then
            echo "::error::Azure deployment token appears invalid"
            exit 1
          fi

          echo "Azure deployment token is configured."

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist/client-management-ui/browser
          api_location: ""
          output_location: ""
          skip_app_build: true
